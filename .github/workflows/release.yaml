name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the dump against the SHACL shapes
        run: |
          pip install rdflib pyshacl
          python scripts/check_corrections.py --dump ttl/ligre_lemmabank.ttl

      - name: Check that the release metadata matches the tag
        run: python3 scripts/generate_release.py check "$GITHUB_REF_NAME" > notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "LiGre Lemma Bank ${GITHUB_REF_NAME#v}" --notes-file notes.md
