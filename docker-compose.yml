services:
  postgres:
    image: postgres:16-alpine
    container_name: ligre-postgres
    environment:
      POSTGRES_DB: ligre_db
      POSTGRES_USER: ligre
      POSTGRES_PASSWORD: ligre
    ports:
      - "5432:5432"
    volumes:
      - ligre_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/schema_corpora.sql:/docker-entrypoint-initdb.d/02_schema_corpora.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ligre -d ligre_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  lemma-loader:
    build: ./loader
    container_name: ligre-lemma-loader
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ligre
      POSTGRES_PASSWORD: ligre
      POSTGRES_DATABASE: ligre_db
    volumes:
      - ./data:/app/data:ro
    command: ["python", "loader/load_lemmas.py"]
    restart: "no"

  corpus-loader:
    build: ./loader
    container_name: ligre-corpus-loader
    depends_on:
      postgres:
        condition: service_healthy
      lemma-loader:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ligre
      POSTGRES_PASSWORD: ligre
      POSTGRES_DATABASE: ligre_db
      LIGRE_BASE_URL: ${LIGRE_BASE_URL:-http://localhost:8082}
    volumes:
      - ./data:/app/data:ro
      - ./ttl/corpora:/app/ttl/corpora:ro
    command: ["python", "loader/load_corpora.py"]
    restart: "no"

  ontop:
    build:
      context: .
      dockerfile: ontop/Dockerfile
    container_name: ligre-ontop
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONTOP_DB_URL: jdbc:postgresql://postgres:5432/ligre_db
      ONTOP_DB_USER: ligre
      ONTOP_DB_PASSWORD: ligre
      ONTOP_MAPPING_FILE: /tmp/mapping.ttl
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/ontop.properties
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      LIGRE_BASE_URL: ${LIGRE_BASE_URL:-http://localhost:8082}
    volumes:
      - ./ontop/input:/opt/ontop/input
      - ./ontop/jdbc:/opt/ontop/jdbc
      - ./ttl/ligre_void.ttl:/opt/ontop/facts/ligre_void.ttl:ro
    ports:
      - "8081:8080"
    command: ./ontop endpoint

  lodview:
    image: ghcr.io/teamdigitale/dati-semantic-lodview:latest
    container_name: ligre-lodview
    depends_on:
      - ontop
    environment:
      LodViewendpoint: http://ontop:8080/sparql
      LodViewendpointInternal: http://ontop:8080/sparql
      LodViewIRInamespace: ${LIGRE_BASE_URL:-http://localhost:8082}/
    ports:
      - "8082:8080"
    restart: unless-stopped

volumes:
  ligre_data:
