, services:
  postgres:
    image: postgres:16-alpine
    container_name: ligre-postgres
    environment:
      POSTGRES_DB: ligre_db
      POSTGRES_USER: ligre
      POSTGRES_PASSWORD: ligre
    ports:
      - "5432:5432"
    volumes:
      - ligre_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ligre -d ligre_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  lemma-loader:
    build: ./data
    container_name: ligre-lemma-loader
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ligre
      POSTGRES_PASSWORD: ligre
      POSTGRES_DATABASE: ligre_db
    volumes:
      - ./data:/app/data:ro
    command: ["python", "data/generate_lemma_data.py"]
    restart: "no"

  ontop:
    build:
      context: ./ontop
      dockerfile: Dockerfile
    container_name: ligre-ontop
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONTOP_DB_URL: jdbc:postgresql://postgres:5432/ligre_db
      ONTOP_DB_USER: ligre
      ONTOP_DB_PASSWORD: ligre
      ONTOP_MAPPING_FILE: /tmp/mapping.ttl
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/ontop.properties
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      LIGRE_BASE_URL: ${LIGRE_BASE_URL:-https://dev.ligre.ugent.be}
    volumes:
      - ./ontop/input:/opt/ontop/input
      - ./ontop/jdbc:/opt/ontop/jdbc
    ports:
      - "8081:8080"
    command: ./ontop endpoint

#  ttl-exporter:
#    build: ./data
#    container_name: ligre-ttl-exporter
#    depends_on:
#      lemma-loader:
#        condition: service_completed_successfully
#      ontop:
#        condition: service_healthy
#    environment:
#      ONTOP_SPARQL_URL: http://ontop:8080/sparql
#      TTL_OUTPUT: /app/ttl/ligreTTLRDF.ttl
#    volumes:
#      - ./ttl:/app/ttl
#    command: ["python", "ttl/export_ttl.py"]
#    restart: "no"

  lodview:
    image: ghcr.io/teamdigitale/dati-semantic-lodview:latest
    container_name: ligre-lodview
    depends_on:
      - ontop
    environment:
      LodViewendpoint: http://ontop:8080/sparql
      LodViewendpointInternal: http://ontop:8080/sparql
      LodViewIRInamespace: ${LIGRE_BASE_URL:-https://dev.ligre.ugent.be}/
    ports:
      - "8082:8080"
    restart: unless-stopped

volumes:
  ligre_data:
